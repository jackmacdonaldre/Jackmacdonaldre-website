name: Auto-publish blog post

on:
  schedule:
    - cron: "0 13 * * 1,3,5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node auto-blog-system/scripts/generate-blog.js

      - name: Commit and push if changes exist
        run: |
          git config user.name "auto-blog-bot"
          git config user.email "auto-blog-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-publish: scheduled blog post"
          git push
