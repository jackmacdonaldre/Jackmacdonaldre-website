name: Auto-publish blog post

on:
  schedule:
    - cron: "0 13 * * 1,3,5"
    # Backup run 5 hours later: publishes only if the main run didn't.
    - cron: "0 18 * * 1,3,5"
  workflow_dispatch: {}

permissions:
  contents: write

# Runs queue one at a time, so a late main run and the backup run never overlap.
concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CATCHUP_RUN: ${{ github.event.schedule == '0 18 * * 1,3,5' }}
        run: node auto-blog-system/scripts/generate-blog.js

      - name: Generate blog pages and update sitemap
        run: node auto-blog-system/scripts/generate-blog-pages.js

      - name: Commit and push if changes exist
        env:
          GIT_BOT_NAME: auto-blog-bot
          GIT_BOT_EMAIL: auto-blog-bot@users.noreply.github.com
        run: '.github/scripts/commit-and-push.sh "Auto-publish: scheduled blog post"'

      - name: Send notification email
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: jack@macdonaldgroupre.com
        run: node auto-blog-system/scripts/send-notification.js
