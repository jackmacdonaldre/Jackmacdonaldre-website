name: Auto-publish blog post

on:
  schedule:
    - cron: "0 13 * * 1,3,5"
    # Backup run 5 hours later: publishes only if the main run didn't.
    - cron: "0 18 * * 1,3,5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CATCHUP_RUN: ${{ github.event.schedule == '0 18 * * 1,3,5' }}
        run: node auto-blog-system/scripts/generate-blog.js

      - name: Generate blog pages and update sitemap
        run: node auto-blog-system/scripts/generate-blog-pages.js

      - name: Commit and push if changes exist
        run: |
          git config user.name "auto-blog-bot"
          git config user.email "auto-blog-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-publish: scheduled blog post"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 15; done

      - name: Send notification email
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: jack@macdonaldgroupre.com
        run: node auto-blog-system/scripts/send-notification.js
