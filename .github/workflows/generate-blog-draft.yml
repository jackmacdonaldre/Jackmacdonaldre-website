name: Daily auto-publish blog post

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./blog-automation
        run: npm install

      - name: Generate and publish post
        working-directory: ./blog-automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          BUSINESS_NAME: ${{ vars.BUSINESS_NAME }}
          WHAT_YOU_DO: ${{ vars.WHAT_YOU_DO }}
          SERVICE_AREA: ${{ vars.SERVICE_AREA }}
          BRAND_TONE: ${{ vars.BRAND_TONE }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: node scripts/generate-and-publish.mjs

      - name: Commit and push new post
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add blog
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-publish: daily blog post $(date -u +'%Y-%m-%d')"
            git push
          fi
