name: Update Active Listings

on:
  schedule:
    - cron: "0 0 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write
jobs:
  update-listings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate listings JSON
        env:
          IDX_ACCESS_KEY: ${{ secrets.IDX_ACCESS_KEY }}
        run: node idx-integration/scripts/generate-listings.js
      - name: Commit and push if changes exist
        run: |
          git config user.name "idx-listings-bot"
          git config user.email "idx-listings-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update active listings"
          git push
