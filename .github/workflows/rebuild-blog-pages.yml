name: Rebuild blog pages

# Rebuilds every /blog/{slug}/ page, blog/index.html and sitemap.xml whenever
# post data or the page template changes (e.g. after a manual edit to a post in
# blog-posts-data.js). Does NOT generate a new post or send an email.

on:
  push:
    branches: [main]
    paths:
      - "blog-posts-data.js"
      - "auto-blog-system/scripts/generate-blog-pages.js"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rebuild blog pages and sitemap
        run: node auto-blog-system/scripts/generate-blog-pages.js
      - name: Commit and push if changes exist
        run: |
          git config user.name "auto-blog-bot"
          git config user.email "auto-blog-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Rebuild blog pages"
          git push
